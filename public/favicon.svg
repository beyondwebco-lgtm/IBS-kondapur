<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="favArc" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#0284C7" />
      <stop offset="100%" stopColor="#38BDF8" />
    </linearGradient>
  </defs>

  <!-- Clean rounded container tile for universal visibility across dark and light browser tabs -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />

  <!-- Dynamic Orbiting Swoosh Arc -->
  <path
    d="M 6 49 C 14 55 34 57 52 45 C 57 41.5 59 36 55 33 C 51 30 46 36 38 41 C 24 49 13 47 8 43 Z"
    fill="url(#favArc)"
  />
  <path
    d="M 18 16 C 30 8 46 9 54 18 C 50 16 38 13 24 19 Z"
    fill="url(#favArc)"
  />

  <!-- Globe Wireframe (Navy) -->
  <circle cx="32" cy="31" r="20" fill="none" stroke="#0B2545" stroke-width="2.5" />
  <path d="M 12 31 H 52" stroke="#0B2545" stroke-width="1.8" />
  <path d="M 14 21 C 20 25 44 25 50 21" stroke="#0B2545" stroke-width="1.6" fill="none" />
  <path d="M 14 41 C 20 37 44 37 50 41" stroke="#0B2545" stroke-width="1.6" fill="none" />
  <ellipse cx="32" cy="31" rx="10" ry="20" fill="none" stroke="#0B2545" stroke-width="1.8" />

  <!-- Multi-Language Speech Bubbles -->
  <!-- Top: Hi (Blue) -->
  <g>
    <rect x="24" y="14" width="16" height="10" rx="3.5" fill="#0284C7" />
    <path d="M 28 24 L 27 27 L 31 24 Z" fill="#0284C7" />
    <text x="32" y="21.5" font-family="system-ui, -apple-system, sans-serif" font-size="7" font-weight="900" fill="#FFFFFF" text-anchor="middle">Hi</text>
  </g>

  <!-- Left: Hola (Orange) -->
  <g>
    <rect x="10" y="25" width="18" height="9" rx="3.5" fill="#F97316" />
    <path d="M 15 34 L 14 36.5 L 17 34 Z" fill="#F97316" />
    <text x="19" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="6.2" font-weight="900" fill="#FFFFFF" text-anchor="middle">Hola</text>
  </g>

  <!-- Right: Bonjour (Purple) -->
  <g>
    <rect x="34" y="24" width="20" height="9" rx="3.5" fill="#7E22CE" />
    <path d="M 37 33 L 35 35.5 L 39 33 Z" fill="#7E22CE" />
    <text x="44" y="31" font-family="system-ui, -apple-system, sans-serif" font-size="5" font-weight="900" fill="#FFFFFF" text-anchor="middle">Bonjour</text>
  </g>

  <!-- Bottom Left: Hallo (Green) -->
  <g>
    <rect x="13" y="36" width="18" height="9" rx="3.5" fill="#15803D" />
    <path d="M 22 45 L 23 47.5 L 25 45 Z" fill="#15803D" />
    <text x="22" y="43" font-family="system-ui, -apple-system, sans-serif" font-size="5.5" font-weight="900" fill="#FFFFFF" text-anchor="middle">Hallo</text>
  </g>

  <!-- Bottom Right: Olá (Red) -->
  <g>
    <rect x="36" y="35" width="15" height="9" rx="3.5" fill="#DC2626" />
    <path d="M 38 44 L 37 46.5 L 40 44 Z" fill="#DC2626" />
    <text x="43.5" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="6" font-weight="900" fill="#FFFFFF" text-anchor="middle">Olá</text>
  </g>
</svg>
